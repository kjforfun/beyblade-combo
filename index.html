<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>陀螺COMBOS111</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: auto; padding: 10px; font-size: 13px; }
        h1 { font-size: 18px; margin: 5px 0; text-align: center; }
        /* 下拉選單列：強制同一列 */
        .filter-row { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
        .filter-item { display: flex; align-items: center; gap: 4px; flex: 1; }
        select { height: 26px; flex-grow: 1; padding: 0 4px; }
        /* 結果標題區塊 */
        .header-group { display: flex; align-items: center; gap: 10px; margin: 10px 0; border-top: 1px solid #ddd; padding-top: 8px; }
        h2 { margin: 0; font-size: 15px; }
        .stats { font-weight: bold; flex-grow: 1; }
        #clearBtn { padding: 4px 10px; cursor: pointer; background: #0b2f6b; color: white; border: none; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>

<h1>陀螺COMBOS</h1>
<div id="status" style="font-size: 11px; color: #888; text-align: center;">載入中...</div>

<div class="filter-row">
    <div class="filter-item"><label>上蓋</label><select id="cover" onchange="syncAndSearch('cover')"></select></div>
    <div class="filter-item"><label>英文</label><select id="english" onchange="syncAndSearch('english')"></select></div>
</div>
<div class="filter-row">
    <div class="filter-item"><label>固鎖</label><select id="ratchet" onchange="search()"></select></div>
    <div class="filter-item"><label>軸</label><select id="bit" onchange="search()"></select></div>
</div>

<div class="header-group">
    <h2>查詢結果</h2>
    <div class="stats" id="count">搜尋比數: 0</div>
    <button id="clearBtn" onclick="resetAll()">✕ 全部清除</button>
</div>

<div id="result"></div>

<script>
    let allData = [], lock = false;
    let mapENtoCover = {}, mapCovertoEN = {};

    fetch("data.json").then(r => r.json()).then(data => {
        allData = data;
        data.forEach(x => {
            if(x["英文"] && x["上蓋"]){
                mapENtoCover[x["英文"]] = x["上蓋"];
                mapCovertoEN[x["上蓋"]] = x["英文"];
            }
        });
        document.getElementById("status").innerText = "✅ 載入完成";
        buildSelect("cover", "上蓋", true);
        buildSelect("english", "英文", false);
        buildSelect("ratchet", "固鎖", false);
        buildSelect("bit", "軸", true);
        search();
    });

    function buildSelect(id, field, sortByCount) {
        const select = document.getElementById(id);
        let values;
        if (sortByCount) {
            const counts = allData.reduce((acc, x) => { acc[x[field]] = (acc[x[field]] || 0) + 1; return acc; }, {});
            values = Object.keys(counts).filter(v => v).sort((a, b) => counts[b] - counts[a]);
        } else {
            values = [...new Set(allData.map(x => x[field]))].filter(v => v).sort();
        }
        select.innerHTML = '<option value="">全部</option>';
        values.forEach(v => select.innerHTML += `<option value="${v}">${v}</option>`);
    }

    function syncAndSearch(changedId) {
        if (lock) return;
        lock = true;
        const c = document.getElementById("cover"), e = document.getElementById("english");
        if (changedId === "cover") e.value = mapCovertoEN[c.value] || "";
        else c.value = mapENtoCover[e.value] || "";
        lock = false;
        search();
    }

    function resetAll() {
        ["cover", "english", "ratchet", "bit"].forEach(id => document.getElementById(id).value = "");
        search();
    }

    function search() {
        let rows = allData.filter(x => 
            (!document.getElementById("cover").value || x["上蓋"] === document.getElementById("cover").value) &&
            (!document.getElementById("english").value || x["英文"] === document.getElementById("english").value) &&
            (!document.getElementById("ratchet").value || x["固鎖"] === document.getElementById("ratchet").value) &&
            (!document.getElementById("bit").value || x["軸"] === document.getElementById("bit").value)
        );
        rows.sort((a,b) => new Date(b["日期"]) - new Date(a["日期"]));
        
        document.getElementById("count").innerText = "搜尋比數: " + rows.length;
        let html = `<table><tr><th>英文</th><th>上蓋</th><th>組合</th><th>名次</th><th>日期</th></tr>`;
        rows.forEach(r => {
            html += `<tr><td>${r["英文"]}</td><td>${r["上蓋"]}</td><td>${r["固鎖"]} ${r["軸"]}</td><td>${r["名次"]==="1st"?"🏆":""}</td><td>${r["日期"]}</td></tr>`;
        });
        document.getElementById("result").innerHTML = html + "</table>";
    }
</script>
</body>
</html>
