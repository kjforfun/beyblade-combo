<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyblade Combo</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:12px;
}

h1{
    font-size:20px;
    margin:8px 0 10px 0;
}

/* filters */
.filters{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
}

.filter-box{
    border:1px solid #ddd;
    border-radius:10px;
    padding:8px;
}

.filter-title{
    font-size:13px;
    margin-bottom:4px;
}

.filter-row{
    display:flex;
    gap:6px;
}

select{
    flex:1;
    padding:6px;
    font-size:14px;
}

button{
    font-size:12px;
    padding:5px 8px;
    cursor:pointer;
}

/* table */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:12px;
    font-size:14px;
}

th,td{
    border:1px solid #ddd;
    padding:6px;
}

th{
    background:#f2f2f2;
}

/* combo colors */
.ratchet{
    color:#0b2f6b;
    font-weight:bold;
}

.bit{
    color:#0b2f6b;
    font-weight:bold;
}

/* date */
.date{
    font-size:11px;
    color:#777;
}

/* rank */
.rank{
    font-size:16px;
}

/* reset */
.reset{
    margin-top:10px;
    padding:6px 10px;
}

</style>

</head>

<body>

<h1>⚔ Beyblade Combo</h1>

<div id="status">載入中...</div>

<div class="filters">

<div class="filter-box">
    <div class="filter-title">上蓋</div>
    <div class="filter-row">
        <select id="cover"></select>
        <button onclick="clearOne('cover')">清除</button>
    </div>
</div>

<div class="filter-box">
    <div class="filter-title">英文</div>
    <div class="filter-row">
        <select id="english"></select>
        <button onclick="clearOne('english')">清除</button>
    </div>
</div>

<div class="filter-box">
    <div class="filter-title">固鎖</div>
    <div class="filter-row">
        <select id="ratchet"></select>
        <button onclick="clearOne('ratchet')">清除</button>
    </div>
</div>

<div class="filter-box">
    <div class="filter-title">軸</div>
    <div class="filter-row">
        <select id="bit"></select>
        <button onclick="clearOne('bit')">清除</button>
    </div>
</div>

</div>

<button class="reset" onclick="resetAll()">🔄 全部清除</button>

<div id="result"></div>

<script>

let allData=[];
let lock=false;
let mapENtoCover={};
let mapCovertoEN={};

fetch("data.json")
.then(r=>r.json())
.then(data=>{

    allData=data;

    data.forEach(x=>{
        if(x["英文"] && x["上蓋"]){
            mapENtoCover[x["英文"]] = x["上蓋"];
            mapCovertoEN[x["上蓋"]] = x["英文"];
        }
    });

    document.getElementById("status").innerText =
        "✅ 載入 " + data.length + " 筆";

    buildSelect("cover","上蓋");
    buildSelect("english","英文");
    buildSelect("ratchet","固鎖");
    buildSelect("bit","軸");

    attachBinding();
    search();

});

function buildSelect(id, field){

    const select=document.getElementById(id);

    const count={};

    allData.forEach(x=>{
        const v=x[field];
        if(!v) return;
        count[v]=(count[v]||0)+1;
    });

    const values=Object.entries(count)
        .sort((a,b)=>b[1]-a[1])
        .map(x=>x[0]);

    select.innerHTML='<option value="">全部</option>';

    values.forEach(v=>{
        select.innerHTML+=`<option value="${v}">${v}</option>`;
    });

    select.addEventListener("change",search);
}

function attachBinding(){

    document.getElementById("english").addEventListener("change",e=>{
        if(lock) return;
        lock=true;
        document.getElementById("cover").value =
            mapENtoCover[e.target.value] || "";
        lock=false;
    });

    document.getElementById("cover").addEventListener("change",e=>{
        if(lock) return;
        lock=true;
        document.getElementById("english").value =
            mapCovertoEN[e.target.value] || "";
        lock=false;
    });
}

function clearOne(id){
    document.getElementById(id).value="";
    search();
}

function resetAll(){
    ["cover","english","ratchet","bit"].forEach(id=>{
        document.getElementById(id).value="";
    });
    search();
}

function search(){

    let rows=[...allData];

    const cover=document.getElementById("cover").value;
    const english=document.getElementById("english").value;
    const ratchet=document.getElementById("ratchet").value;
    const bit=document.getElementById("bit").value;

    if(cover) rows=rows.filter(x=>x["上蓋"]===cover);
    if(english) rows=rows.filter(x=>x["英文"]===english);
    if(ratchet) rows=rows.filter(x=>x["固鎖"]===ratchet);
    if(bit) rows=rows.filter(x=>x["軸"]===bit);

    rows.sort((a,b)=>new Date(b["日期"]) - new Date(a["日期"]));

    let html=`
    <h2>結果 (${rows.length})</h2>
    <table>
    <tr>
        <th>英文</th>
        <th>上蓋</th>
        <th>組合</th>
        <th>名次</th>
        <th>日期</th>
    </tr>
    `;

    rows.forEach(r=>{

        let rank="";
        if(r["名次"]==="1st") rank="🏆";

        html+=`
        <tr>
            <td>${r["英文"]||""}</td>
            <td>${r["上蓋"]||""}</td>
            <td>
                <span class="ratchet">${r["固鎖"]||""}</span>
                <span class="bit">${r["軸"]||""}</span>
            </td>
            <td class="rank">${rank}</td>
            <td class="date">${r["日期"]||""}</td>
        </tr>
        `;
    });

    html+="</table>";

    document.getElementById("result").innerHTML=html;
}

</script>

</body>
</html>
