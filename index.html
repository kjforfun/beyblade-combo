<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyblade Combo</title>

<style>
body{
    font-family: Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
}
.card{
    border:1px solid #ddd;
    padding:20px;
    border-radius:8px;
}
</style>

</head>
<body>

<h1>Beyblade Combo</h1>

<div class="card">
    <h3>資料載入狀態</h3>
    <div id="status">載入中...</div>
</div>

<script>

fetch("data.json")
.then(r => r.json())
.then(data => {

    document.getElementById("status").innerHTML =
        "✅ 成功載入 " + data.length + " 筆資料";

    console.log(data);

})
.catch(err => {

    document.getElementById("status").innerHTML =
        "❌ 載入失敗";

    console.error(err);

});

</script>

</body>
</html>
